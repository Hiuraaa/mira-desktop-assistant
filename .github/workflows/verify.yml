name: Verify and package Mira

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q mira tests examples run_mira.py
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Run phone cloud tests
        if: runner.os == 'Linux'
        run: node --test cloud/tests/worker.test.mjs
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - name: Install browser test tools (app needs no npm dependencies)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTools = Join-Path $env:RUNNER_TEMP 'mira-browser-tests'
          npm install --prefix $testTools --no-audit --no-fund playwright@1.58.2
          "MIRA_PLAYWRIGHT_MODULE=$testTools/node_modules/playwright" >> $env:GITHUB_ENV
      - name: Verify Studio desktop interactions and capture previews
        if: runner.os == 'Windows'
        shell: pwsh
        run: node tests/studio_ui.mjs
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && always()
        with:
          name: Mira-Studio-preview
          path: studio-preview/*.png
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Make downloadable ZIP
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: Mira-Desktop-Assistant-v2
          path: |
            .gitignore
            README.md
            run_mira.py
            start_windows.bat
            mira/
            examples/
            cloud/
            tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
